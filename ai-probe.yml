name: RusukhAIProbe
packages:
  MLX:
    url: https://github.com/ml-explore/mlx-swift
    exactVersion: 0.32.3
  MLXLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    exactVersion: 3.32.3
  Transformers:
    url: https://github.com/huggingface/swift-transformers
    exactVersion: 1.3.0
targets:
  RusukhAIProbe:
    type: tool
    platform: macOS
    deploymentTarget: '14.0'
    sources:
      - App/ArabicModelRuntime.swift
      - scripts/ArabicModelProbe.swift
    dependencies:
      - package: MLX
        product: MLX
      - package: MLXLM
        product: MLXLLM
      - package: MLXLM
        product: MLXLMCommon
      - package: Transformers
        product: Tokenizers
    settings:
      base:
        SWIFT_VERSION: '6.0'
        CODE_SIGNING_ALLOWED: NO
schemes:
  RusukhAIProbe:
    build:
      targets:
        RusukhAIProbe: all
