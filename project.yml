name: RusukhNative
packages:
  FSRS:
    url: https://github.com/open-spaced-repetition/swift-fsrs
    revision: 4fbaf20184d62f82a9f44f343337c61a2c5483e9
  MLX:
    url: https://github.com/ml-explore/mlx-swift
    exactVersion: 0.32.3
  MLXLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    exactVersion: 3.32.3
  Transformers:
    url: https://github.com/huggingface/swift-transformers
    exactVersion: 1.3.0
options:
  bundleIdPrefix: com.scrv1
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: ""
targets:
  RusukhAppTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests]
    dependencies:
      - target: RusukhNative
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.scrv1.rusukhnative.apptests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/RusukhNative.app/RusukhNative"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGNING_ALLOWED: NO
  RusukhUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: RusukhNative
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.scrv1.rusukhnative.uitests
        TEST_TARGET_NAME: RusukhNative
        CODE_SIGNING_ALLOWED: NO
  RusukhNative:
    type: application
    platform: iOS
    dependencies:
      - package: FSRS
        product: FSRS
      - package: MLX
        product: MLX
      - package: MLXLM
        product: MLXLLM
      - package: MLXLM
        product: MLXLMCommon
      - package: Transformers
        product: Tokenizers
    sources:
      - path: App
      - path: Sources/RusukhCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scrv1.rusukhnative
        PRODUCT_NAME: RusukhNative
        INFOPLIST_KEY_CFBundleDisplayName: "Rusukh"
        INFOPLIST_KEY_NSCameraUsageDescription: "التقاط صور وربطها بالملاحظات التعليمية داخل رُسوخ."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_ENTITLEMENTS: App/RusukhNative.entitlements
        SWIFT_EMIT_LOC_STRINGS: YES
    info:
      path: App/Info.plist
      properties:
        CFBundleDevelopmentRegion: ar
        CFBundleLocalizations: [ar, en]
        UIApplicationSupportsDocumentBrowser: false
        UIFileSharingEnabled: false
        CFBundleDisplayName: "Rusukh"
        NSMicrophoneUsageDescription: "تسجيل صوت وإرفاقه بملاحظاتك محليًا داخل رُسوخ."
        NSCameraUsageDescription: "التقاط صورة وإرفاقها بملاحظة داخل رُسوخ."
        UIRequiredDeviceCapabilities: [arm64]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]

schemes:
  RusukhNative:
    build:
      targets:
        RusukhNative: all
        RusukhUITests: [test]
        RusukhAppTests: [test]
    test:
      targets: [RusukhAppTests, RusukhUITests]
