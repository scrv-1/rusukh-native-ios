name: iOS - SwiftUI build and simulator preview
on:
  workflow_dispatch:
    inputs:
      evaluate_local_ai:
        description: 'Run bounded Arabic model feasibility test instead of iOS builds'
        type: boolean
        default: false
      model_variant:
        description: 'Public pinned Qwen model for evaluation only'
        type: choice
        default: '0.6B'
        options:
          - '0.6B'
          - '1.7B'
          - '4B'
          - '4B-Instruct-2507'
permissions:
  contents: read
concurrency:
  group: rusukh-native-build
  cancel-in-progress: false
jobs:
  build:
    if: ${{ !inputs.evaluate_local_ai }}
    name: Test, build and launch SwiftUI
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Record toolchain and source
        run: |
          mkdir -p evidence
          { echo "Commit: $GITHUB_SHA"; date -u; sw_vers; xcodebuild -version; swift --version; uname -m; xcode-select -p; xcodebuild -showsdks; ls -d /Applications/Xcode*; xcrun --find simctl; xcrun lldb --version; python3 --version; git --version; } | tee evidence/environment.txt
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Test core logic
        run: |
          set -o pipefail
          swift test 2>&1 | tee evidence/core-tests.log
      - name: Generate Xcode project
        run: |
          xcodegen generate --spec project.yml
          xcodebuild -list -project RusukhNative.xcodeproj | tee evidence/project.txt
      - name: Build simulator app
        id: simulator
        run: |
          set -o pipefail
          xcodebuild -project RusukhNative.xcodeproj -scheme RusukhNative \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' ARCHS=arm64 \
            -derivedDataPath "$RUNNER_TEMP/simulator-build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee evidence/simulator-build.log
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/simulator-build/Build/Products/Debug-iphonesimulator/RusukhNative.app" \
            RusukhNative-simulator.zip
      - name: Build unsigned device app
        id: device
        run: |
          set -o pipefail
          xcodebuild -project RusukhNative.xcodeproj -scheme RusukhNative \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/device-build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee evidence/device-build.log
          mkdir -p "$RUNNER_TEMP/package/Payload"
          cp -R "$RUNNER_TEMP/device-build/Build/Products/Release-iphoneos/RusukhNative.app" "$RUNNER_TEMP/package/Payload/"
          (cd "$RUNNER_TEMP/package" && zip -qyr "$GITHUB_WORKSPACE/RusukhNative-unsigned.ipa" Payload)
      - name: Launch simulator and capture preview
        timeout-minutes: 7
        run: bash scripts/simulator-preview.sh
      - name: Build xtool 1.24.0 unsigned IPA
        id: xtool
        timeout-minutes: 8
        run: |
          set -o pipefail
          curl -fL --retry 2 https://github.com/xtool-org/xtool/releases/download/1.24.0/xtool.app.zip -o "$RUNNER_TEMP/xtool.app.zip"
          echo "a56e98d69dea02a97a17e609f0ae8771c57ffaab23f1d62513fd9ada222026b3  $RUNNER_TEMP/xtool.app.zip" | shasum -a 256 -c -
          ditto -x -k "$RUNNER_TEMP/xtool.app.zip" "$RUNNER_TEMP/xtool-cli"
          export PATH="$RUNNER_TEMP/xtool-cli/xtool.app/Contents/Resources/bin:$PATH"
          xtool --version | tee evidence/xtool-version.txt
          bash scripts/build-xtool.sh 2>&1 | tee evidence/xtool-build.log
          cp xtool/RusukhNative.ipa RusukhNative-xtool-unsigned.ipa
      - name: Provision verified local model for simulator test
        timeout-minutes: 5
        run: |
          set -o pipefail
          SIMULATOR_ID=$(cat evidence/simulator-id.txt)
          xcrun simctl boot "$SIMULATOR_ID"
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          python3 scripts/prepare-simulator-model.py | tee evidence/ai-simulator-provision.log
          swiftc App/ArabicModelAssets.swift scripts/VerifyModelAssets.swift -o "$RUNNER_TEMP/verify-model-assets"
          SIMULATOR_ID=$(cat evidence/simulator-id.txt)
          APP_DATA=$(xcrun simctl get_app_container "$SIMULATOR_ID" com.scrv1.rusukhnative data)
          "$RUNNER_TEMP/verify-model-assets" "$APP_DATA/Library/Application Support/RusukhTestModels/Qwen3-Instruct-2507" | tee evidence/ai-swift-integrity.log
      - name: Test Arabic UI and persistence
        timeout-minutes: 10
        run: bash scripts/ui-tests.sh
      - name: Verify current Swift runtime offline on Mac (not Simulator)
        timeout-minutes: 10
        run: |
          set -o pipefail
          xcodegen generate --spec ai-probe.yml
          xcodebuild -project RusukhAIProbe.xcodeproj -scheme RusukhAIProbe -configuration Release -destination 'platform=macOS,arch=arm64' -derivedDataPath "$RUNNER_TEMP/ai-swift-build" CODE_SIGNING_ALLOWED=NO build > evidence/ai-swift-build.log 2>&1 || { tail -n 100 evidence/ai-swift-build.log; exit 1; }
          MODEL_DIRECTORY=$(cat evidence/ai-simulator-model-directory.txt)
          sandbox-exec -p '(version 1)(allow default)(deny network*)' "$RUNNER_TEMP/ai-swift-build/Build/Products/Release/RusukhAIProbe" "$MODEL_DIRECTORY" docs/arabic-eval-cases.json | tee evidence/ai-swift-inference.log
      - name: Record artifact checksums
        run: |
          shasum -a 256 RusukhNative-simulator.zip RusukhNative-unsigned.ipa RusukhNative-xtool-unsigned.ipa evidence/simulator-home.png | tee evidence/SHA256SUMS.txt
          plutil -lint "$RUNNER_TEMP/device-build/Build/Products/Release-iphoneos/RusukhNative.app/PrivacyInfo.xcprivacy" | tee evidence/privacy-manifest-validation.txt
          cp "$RUNNER_TEMP/device-build/Build/Products/Release-iphoneos/RusukhNative.app/PrivacyInfo.xcprivacy" evidence/PrivacyInfo.xcprivacy
          { echo '## Verified build outputs'; echo "Source commit: $GITHUB_SHA"; echo '- Core and Arabic UI/download tests passed'; echo '- MLX inference is unavailable in iOS Simulator; Swift inference verified separately on Mac with network denied'; echo '- xtool unsigned IPA build passed'; echo '- Simulator and unsigned device builds passed'; echo '- App launched on a cloud iOS simulator'; echo '- Screenshot, logs and checksums are in the evidence artifact'; echo '- Neither artifact installs itself on an iPhone'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload simulator app
        if: always() && steps.simulator.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: RusukhNative-simulator
          path: RusukhNative-simulator.zip
          if-no-files-found: error
          retention-days: 7
      - name: Upload unsigned device IPA
        if: always() && steps.device.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: RusukhNative-unsigned-ipa
          path: RusukhNative-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
      - name: Package source with xtool configuration
        if: always()
        run: |
          git archive --format=zip --prefix=RusukhNative-xtool/ HEAD -o RusukhNative-xtool-project.zip
          shasum -a 256 RusukhNative-xtool-project.zip | tee evidence/source-SHA256.txt
      - name: Upload xtool project
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RusukhNative-xtool-project
          path: RusukhNative-xtool-project.zip
          if-no-files-found: error
          retention-days: 7
      - name: Upload xtool IPA
        if: always() && steps.xtool.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: RusukhNative-xtool-unsigned-ipa
          path: RusukhNative-xtool-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RusukhNative-build-evidence
          path: evidence/
          if-no-files-found: error
          retention-days: 7

  local-ai-evaluation:
    if: ${{ inputs.evaluate_local_ai }}
    name: Evaluate Arabic model offline on cloud Mac
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      DO_NOT_TRACK: '1'
      TOKENIZERS_PARALLELISM: 'false'
      MODEL_VARIANT: ${{ inputs.model_variant || '0.6B' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record Mac and Metal availability
        run: |
          mkdir -p evidence
          { echo "Commit: $GITHUB_SHA"; date -u; sw_vers; uname -m; python --version; xcodebuild -version; } | tee evidence/ai-environment.txt
          swift -e 'import Metal; print(MTLCreateSystemDefaultDevice()?.name ?? "NO_METAL_DEVICE")' | tee evidence/metal-device.txt
      - name: Install pinned model runtime
        run: |
          python -m venv "$RUNNER_TEMP/ai-venv"
          "$RUNNER_TEMP/ai-venv/bin/python" -m pip install 'mlx-lm==0.32.2' 'mlx==0.32.4'
          "$RUNNER_TEMP/ai-venv/bin/python" -m pip freeze > evidence/ai-dependencies.txt
      - name: Download public Apache-2.0 model at pinned revision
        timeout-minutes: 4
        run: '"$RUNNER_TEMP/ai-venv/bin/python" scripts/evaluate-local-ai.py download "$RUNNER_TEMP/qwen-model"'
      - name: Generate Arabic with network denied by macOS sandbox
        timeout-minutes: 5
        run: |
          set -o pipefail
          export HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1
          sandbox-exec -p '(version 1)(allow default)(deny network*)' "$RUNNER_TEMP/ai-venv/bin/python" scripts/evaluate-local-ai.py evaluate "$RUNNER_TEMP/qwen-model" | tee evidence/ai-inference.log
      - name: Build shared Swift MLX runtime probe
        if: inputs.model_variant == '4B-Instruct-2507'
        timeout-minutes: 12
        run: |
          set -o pipefail
          HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          xcodegen generate --spec ai-probe.yml
          xcodebuild -project RusukhAIProbe.xcodeproj -scheme RusukhAIProbe -configuration Release -destination 'platform=macOS,arch=arm64' -derivedDataPath "$RUNNER_TEMP/ai-swift-build" CODE_SIGNING_ALLOWED=NO build 2>&1 | tee evidence/ai-swift-build.log
      - name: Evaluate shared Swift runtime with network denied
        if: inputs.model_variant == '4B-Instruct-2507'
        timeout-minutes: 4
        run: |
          set -o pipefail
          sandbox-exec -p '(version 1)(allow default)(deny network*)' "$RUNNER_TEMP/ai-swift-build/Build/Products/Release/RusukhAIProbe" "$RUNNER_TEMP/qwen-model" evidence/ai-results.json | tee evidence/ai-swift-inference.log
      - name: Upload evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RusukhNative-local-ai-evaluation
          path: evidence/
          if-no-files-found: error
          retention-days: 7
