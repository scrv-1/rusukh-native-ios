name: Expo preview tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: expo-preview-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, core tests, and Jest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: expo-preview
    env:
      CI: true
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: expo-preview/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Core tests
        run: npm test

      - name: Jest UI and integration tests
        run: npm run test:ui -- --watchman=false --forceExit
