name: Feature request
description: Suggest an improvement for Rusukh
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do as a learner or contributor?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: arabic
    attributes:
      label: Arabic / RTL / offline considerations
      description: How should this behave with Arabic text, right-to-left layout and no network?
